{% assign post = include.post %}
<article class="tile">
	<a href="{{ post.url }}">{{ post.title }}</a>
	<p id="article-short-{{ post.id }}">{{ post.content | strip_html | truncate:180 }}</p>
	<div class="tile-footer">
		<span class="project-meta">{{ post.date | date: "%b %d, %Y" }}</span>
		{% for topic in post.topics %}<span class="topic-tag">{{ topic }}</span>{% endfor %}
	</div>
</article>
