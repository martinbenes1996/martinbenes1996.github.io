---
layout: default
title: Stories
---


<div class="container main">
	<div class="row">
		<div class="col-md-5 col-sm-12 first-column">
			<h1 class="profile-header" title="[marc&#618;n &#712;b&#603;n&#603;&#643;]"><a href="/" class="noformat"><strong>Martin Beneš</strong></a><br />
				<span class="h5 text-muted" style="visibility: hidden">data scientist & researcher</span>
			</h1>
			<img src="img/martinbenes.jpg" title="Martin Benes" class="profile-photo" alt="Title photo of the author Martin Benes." />
			{% include profile-links.html %}
		</div>
		<div class="col-md-7 col-sm-12 second-column">
			{% include nav.html %}
			<div class="row">
				<h2 class="section-header">Stories</h2>
				<hr class="section-separator" />
				<div>

					{% for post in site.posts %}
					<article class="list-item">
						<a href="{{ post.url }}">{{ post.title }}</a><br />
						<span class="text-muted">{{ post.date | date: "%b %d, %Y" }}</span><br />
						<p id="article-short-{{ post.id }}">{{ post.content | strip_html | truncate:180 }}</p>
					</article>
					{% endfor %}

				</div>
				<br />

			</div>
		</div>
	</div>
</div>
