---
layout: default
---

<!-- MathJax configuration -->
<script>
	window.MathJax = {
		tex: {
			inlineMath: [ ['$','$'], ['\\(','\\)'] ],
			displayMath: [ ['$$','$$'], ['\\[','\\]'] ],
			processEscapes: true,
			processEnvironments: true,
			tags: 'ams'
		},
		options: {
			// the menu can load speech tools from a third-party CDN
			enableMenu: false
		}
	};
</script>
<script src="/lib/mathjax/tex-svg-full.js"></script>

<div class="container">
    <div class="row">
        <div class="col-md-12">
            <!-- Title -->
            <h1>
                {{ page.title }}
            </h1>
            <!-- Author -->
            <strong>
                {{ page.author }}
            </strong><br/>
            <!-- Date -->
            <small>
                <time datetime="{{ page.date }}">
                    {{ page.date | date: "%b %d, %Y" }}
                </time>
            </small>
            <hr class="portfolio-separator" />
        </div>
    </div>
	<div class="row">
        <div class="col-md-12">
            <article class="list-item article-text">
    			{{ content }}
            </article>
        </div>
    </div>
</div>
